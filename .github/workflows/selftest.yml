name: Self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install:
    name: Install on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gyrseek (latest pinned)
        id: gyrseek
        uses: ./

      - name: Check what was installed
        env:
          INSTALLED: ${{ steps.gyrseek.outputs.version }}
        run: |
          set -euo pipefail
          expected=$(find support/locks -name 'gyrseek-*.txt' | sed -n 's#.*/gyrseek-\(.*\)\.txt$#\1#p' | sort -V | tail -n 1)
          [ "$INSTALLED" = "$expected" ] || { echo "::error::installed $INSTALLED, expected $expected"; exit 1; }
          [ "$(gyrseek --version)" = "gyrseek $expected" ] || { echo "::error::gyrseek --version disagrees"; exit 1; }

  versions:
    name: List the pinned versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One entry per support/locks/gyrseek-X.Y.Z.txt, so adding a version adds a test.
      - name: List
        id: list
        run: |
          set -euo pipefail
          versions=$(find support/locks -name 'gyrseek-*.txt' | sed -n 's#.*/gyrseek-\(.*\)\.txt$#\1#p' | sort -V | jq -R -s -c 'split("\n")[:-1]')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  each-version:
    name: ${{ matrix.version }} on ${{ matrix.runner }}
    needs: versions
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        version: ${{ fromJSON(needs.versions.outputs.versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gyrseek ${{ matrix.version }}
        id: gyrseek
        uses: ./
        with:
          version: ${{ matrix.version }}

      - name: Check what was installed
        env:
          VERSION: ${{ matrix.version }}
          INSTALLED: ${{ steps.gyrseek.outputs.version }}
        run: |
          set -euo pipefail
          [ "$INSTALLED" = "$VERSION" ] || { echo "::error::installed $INSTALLED, asked for $VERSION"; exit 1; }
          [ "$(gyrseek --version)" = "gyrseek $VERSION" ] || { echo "::error::gyrseek --version disagrees"; exit 1; }

  without-attestation:
    name: The attestation check can be switched off
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the newest pinned gyrseek without it
        id: gyrseek
        uses: ./
        with:
          verify-attestation: "false"

      - name: Check
        env:
          INSTALLED: ${{ steps.gyrseek.outputs.version }}
        run: test "$(gyrseek --version)" = "gyrseek $INSTALLED"

  refuses:
    name: Refuses what it should
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: A version that is not pinned, and one that is not a version
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -u
          for v in 0.0.1 '1.4.3; id' 'latest-ish'; do
            if RUNNER_OS=Linux RUNNER_ARCH=X64 RUNNER_TEMP="$RUNNER_TEMP_DIR" GITHUB_PATH=/dev/null GITHUB_OUTPUT=/dev/null \
               GHA_GYRSEEK_VERSION="$v" ./action.sh; then
              echo "::error::version '$v' was accepted"; exit 1
            fi
          done

      - name: A tampered hash
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -u
          copy=$(mktemp -d)
          cp -R action.sh support "$copy/"
          sed -i 's/^2d30b35a/3d30b35a/;s/^273c5cea/373c5cea/' "$copy/support/locks/gyrseek-1.4.3.txt"
          if RUNNER_OS=Linux RUNNER_ARCH=X64 RUNNER_TEMP="$RUNNER_TEMP_DIR" GITHUB_PATH=/dev/null GITHUB_OUTPUT=/dev/null \
             GHA_GYRSEEK_VERIFY_ATTESTATION=false "$copy/action.sh"; then
            echo "::error::an archive with the wrong hash was installed"; exit 1
          fi

  # The matrix rows are named after the versions and runners, so their names change
  # whenever a version is pinned. This one job has a stable name: require it (and
  # Lint) in the ruleset instead of the individual rows.
  all-passed:
    name: Self-test passed
    if: ${{ always() }}
    needs: [install, versions, each-version, without-attestation, refuses]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -eu
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "::error::a self-test job finished as '$result'"; exit 1; }
          done
